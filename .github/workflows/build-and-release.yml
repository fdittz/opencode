name: Build and Release

on:
  push:
    branches:
      - dev
      - subs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        if: always()
        run: |
          gh release delete ${{ steps.version.outputs.tag }} --yes || true
          git push origin :refs/tags/${{ steps.version.outputs.tag }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create install script
        run: |
          cat > install-opencode.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Installing OpenCode dev binary..."
          cd /tmp
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
             BINARY="opencode-linux-x64"
          elif [ "$ARCH" = "aarch64" ]; then
             BINARY="opencode-linux-arm64"
          else
             echo "Unsupported architecture: $ARCH"
             exit 1
          fi
          curl -L -o opencode "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${BINARY}"
          chmod +x opencode
          mkdir -p ~/.opencode/bin
          mv opencode ~/.opencode/bin/opencode
          echo "OpenCode installed to ~/.opencode/bin/opencode"
          echo ""
          echo "Add to your PATH:"
          echo '  export PATH="$HOME/.opencode/bin:$PATH"'
          echo ""
          echo "Run with: opencode"
          EOF
          chmod +x install-opencode.sh

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          # Backup original package.json
          cp packages/opencode/package.json packages/opencode/package.json.bak
          
          # Replace workspace:* with file:../ paths in opencode package.json
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          
          // Replace workspace dependencies with file paths
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            }
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            }
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            }
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/util'] = 'file:../util';
            }
          }
          
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          
          # Reinstall with file paths
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build all linux binaries
        run: |
          cd packages/opencode
          bun run build
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          
      - name: Restore original package.json
        if: always()
        run: |
          if [ -f packages/opencode/package.json.bak ]; then
            mv packages/opencode/package.json.bak packages/opencode/package.json
          fi

      - name: Copy all linux binaries
        run: |
          mkdir -p release-binaries
          for dir in packages/opencode/dist/opencode-linux*/bin; do
            binary="$dir/opencode"
            if [ -f "$binary" ]; then
              platform=$(basename $(dirname "$dir"))
              cp "$binary" "release-binaries/${platform}"
              chmod +x "release-binaries/${platform}"
            fi
          done
          ls -la release-binaries/

      - name: Upload CLI artifact for desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist
          retention-days: 1

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: false
          files: |
            release-binaries/*
            install-opencode.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          cp packages/opencode/package.json packages/opencode/package.json.bak
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') pkg.dependencies['@opencode-ai/util'] = 'file:../util';
          }
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build macOS arm64 binary
        run: |
          cd packages/opencode
          bun run build --single
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.tag }}

      - name: Copy binary and make executable
        run: |
          BINARY=$(find packages/opencode/dist -name "opencode" -type f | head -1)
          cp "$BINARY" opencode-macos-arm64
          chmod +x opencode-macos-arm64

      - name: Upload macOS binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    runs-on: macos-13
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          cp packages/opencode/package.json packages/opencode/package.json.bak
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') pkg.dependencies['@opencode-ai/util'] = 'file:../util';
          }
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build macOS x64 binary
        run: |
          cd packages/opencode
          bun run build --single
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.tag }}

      - name: Copy binary and make executable
        run: |
          BINARY=$(find packages/opencode/dist -name "opencode" -type f | head -1)
          cp "$BINARY" opencode-macos-x64
          chmod +x opencode-macos-x64

      - name: Upload macOS Intel binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode-macos-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        shell: pwsh
        run: |
          Copy-Item packages/opencode/package.json packages/opencode/package.json.bak
          $pkg = Get-Content packages/opencode/package.json | ConvertFrom-Json
          if ($pkg.dependencies.'@opencode-ai/plugin' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/plugin' = 'file:../plugin' }
          if ($pkg.dependencies.'@opencode-ai/script' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/script' = 'file:../script' }
          if ($pkg.dependencies.'@opencode-ai/sdk' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/sdk' = 'file:../sdk/js' }
          if ($pkg.dependencies.'@opencode-ai/util' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/util' = 'file:../util' }
          $pkg | ConvertTo-Json -Depth 100 | Set-Content packages/opencode/package.json
          cd packages/opencode
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          bun install --no-save
          cd ../..

      - name: Build Windows x64 binary
        run: |
          cd packages/opencode
          bun run build --single
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.tag }}

      - name: Copy binary
        shell: pwsh
        run: |
          Write-Host "Listing contents of packages/opencode/dist:"
          Get-ChildItem -Path packages/opencode/dist -Recurse | Format-Table Name, FullName
          
          $binary = Get-ChildItem -Path packages/opencode/dist -Filter opencode.exe -File -Recurse | Select-Object -First 1
          
          if ($null -eq $binary) {
            Write-Host "ERROR: opencode.exe not found in packages/opencode/dist"
            Write-Host "Searching for any .exe files:"
            Get-ChildItem -Path packages/opencode/dist -Filter *.exe -File -Recurse | Format-Table Name, FullName
            exit 1
          }
          
          Write-Host "Found binary at: $($binary.FullName)"
          Copy-Item $binary.FullName opencode.exe

      - name: Upload Windows binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-unknown-linux-gnu

      - name: Build full project
        run: bun install

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist
        continue-on-error: true

      - name: Prepare desktop build
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: x86_64-unknown-linux-gnu
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Install tauri-cli from portable appimage branch
        run: |
          cargo install tauri-cli --git https://github.com/tauri-apps/tauri --branch feat/truly-portable-appimage --force
          echo "Installed tauri-cli version:"
          cargo tauri --version

      - name: Build desktop
        run: |
          cd packages/desktop
          cargo tauri build --target x86_64-unknown-linux-gnu --config ./src-tauri/tauri.conf.json --verbose
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true

      - name: List build artifacts
        run: |
          echo "Listing build artifacts:"
          find packages/desktop/src-tauri/target -name "*.AppImage" -o -name "*.deb"

      - name: Prepare release artifacts
        run: |
          mkdir -p desktop-release
          find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.AppImage" -exec cp {} desktop-release/opencode-desktop-linux-x64.AppImage \;
          find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -name "*.deb" -exec cp {} desktop-release/opencode-desktop-linux-x64.deb \;
          ls -la desktop-release/

      - name: Upload desktop binaries to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: desktop-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-windows:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-pc-windows-msvc

      - name: Build full project
        run: bun install

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist
        continue-on-error: true

      - name: Prepare desktop build
        shell: pwsh
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.build.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: x86_64-pc-windows-msvc
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build desktop
        shell: pwsh
        run: |
          cd packages/desktop
          bun tauri build --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.conf.json --verbose

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "Listing build artifacts:"
          Get-ChildItem -Path packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.exe,*.msi

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-release
          
          # Find NSIS installer
          $nsisPath = "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (Test-Path $nsisPath) {
            $nsis = Get-ChildItem -Path $nsisPath -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($nsis) {
              Copy-Item $nsis.FullName desktop-release/opencode-desktop-windows-x64.exe
              Write-Host "Copied NSIS installer: $($nsis.Name)"
            }
          }
          
          # Find MSI installer (optional)
          $msiPath = "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          if (Test-Path $msiPath) {
            $msi = Get-ChildItem -Path $msiPath -Filter "*.msi" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msi) {
              Copy-Item $msi.FullName desktop-release/opencode-desktop-windows-x64.msi
              Write-Host "Copied MSI installer: $($msi.Name)"
            }
          }
          
          Write-Host "Release artifacts:"
          Get-ChildItem desktop-release
          
          # Verify at least one artifact exists
          $count = (Get-ChildItem desktop-release).Count
          if ($count -eq 0) {
            Write-Host "ERROR: No desktop artifacts were created"
            exit 1
          }

      - name: Upload desktop binaries to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: desktop-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
